[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theosis-mcp"
version = "0.1.0"
description = "Theological Research MCP Server — PostgreSQL-backed Bible study with 140+ translations, lexicons, commentaries, and extra-biblical texts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Theosis Contributors"},
    {name = "David Jayatillake", url = "https://github.com/djayatillake/studybible-mcp"},
]
keywords = ["bible", "mcp", "theology", "greek", "hebrew", "lexicon", "church-fathers", "apocrypha"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Religion",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Religion",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
sse = [
    "starlette>=0.32.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6.0",
]

[project.scripts]
theosis-mcp = "theosis_mcp.server:main"

[project.urls]
Homepage = "https://github.com/PrattyT85/theosis-mcp"
Documentation = "https://github.com/PrattyT85/theosis-mcp#readme"
Repository = "https://github.com/PrattyT85/theosis-mcp.git"
Issues = "https://github.com/PrattyT85/theosis-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.sql", "*.md"]
